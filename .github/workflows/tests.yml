name: Python Tests

on:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Run tests
        run: pytest -q
